<title>Generador de texto PCB-SVG</title>

    h1 { font-size: 28px; color: #1e293b; margin-bottom: 4px; }
    p.sub { color: #64748b; margin-bottom: 24px; font-size: 14px; }
    .card { background: #fff; border: 1px solid #e2e8f0; padding: 24px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.03em; }
    input[type="text"] { width: 100%; padding: 10px 14px; font-size: 16px; border: 1px solid #cbd5e1; outline: none; font-family: 'Courier New', monospace; }
    input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
    button { padding: 8px 20px; font-size: 14px; font-weight: 500; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; border-radius: 4px; }
    button:hover { background: #f1f5f9; }
    button.primary { background: #1e293b; color: #fff; border-color: #1e293b; }
    button.primary:hover { background: #334155; }
    .slider-group { display: flex; align-items: center; gap: 10px; }
    .slider-group input[type="range"] { width: 100px; }
    .slider-group span { font-size: 13px; color: #64748b; min-width: 40px; }
    #output { width: 100%; overflow-x: auto; background: #fafafa; border: 1px solid #e2e8f0; padding: 16px; min-height: 280px; display: flex; align-items: center; justify-content: center; }
    #output svg { max-width: 100%; height: auto; background: #fff; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
    .legend-letter { width: 36px; height: 44px; border: 1px solid #e2e8f0; cursor: pointer; padding: 2px; opacity: 0.85; }
    .legend-letter:hover { opacity: 1; border-color: #3b82f6; }
    .legend-letter svg { width: 100%; height: 100%; }
    .legend-letter.active { border-color: #3b82f6; background: #eff6ff; }
    textarea.code-output { width: 100%; min-height: 120px; font-family: 'Courier New', monospace; font-size: 12px; padding: 12px; border: 1px solid #e2e8f0; background: #f8fafc; resize: vertical; }
    .copy-btn { position: relative; float: right; margin-top: -40px; margin-right: 8px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
    <h1>Generador de texto estilo PCB</h1>
    <p class="sub">Escribí cualquier palabra o frase y genera una composición SVG con el diseño de pistas electrónicas.</p>

    <div class="card">
        <label for="textInput">Texto</label>
        <input type="text" id="textInput" value="DATACORR" placeholder="Escribí algo..." autofocus>
        <div class="controls">
            <button class="primary" onclick="generar()">Generar</button>
            <button onclick="descargarSVG()">Descargar SVG</button>
            <button onclick="descargarPNG()">Descargar PNG</button>
            <div class="slider-group">
                <span>Separación:</span>
                <input type="range" id="spacingSlider" min="140" max="260" value="200" oninput="generar()">
                <span id="spacingValue">200</span>
            </div>
            <div class="slider-group">
                <span>Tamaño:</span>
                <input type="range" id="sizeSlider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="generar()">
                <span id="sizeValue">1.0</span>
            </div>
        </div>
        <div id="output"></div>
    </div>

    <div class="card">
        <label>Abecedario completo (hacé clic para insertar)</label>
        <div class="legend" id="legend"></div>
    </div>

    <div class="card">
        <label>Código SVG generado</label>
        <button class="copy-btn" onclick="copiarCodigo()">Copiar</button>
        <textarea class="code-output" id="codeOutput" readonly></textarea>
    </div>
</div>
<div class="toast" id="toast"></div>

// ============================================================
// GENERADOR
// ============================================================
function generar() {
    const texto = document.getElementById('textInput').value.toUpperCase();
    const spacing = parseInt(document.getElementById('spacingSlider').value);
    const scale = parseFloat(document.getElementById('sizeSlider').value);

    document.getElementById('spacingValue').textContent = spacing;
    document.getElementById('sizeValue').textContent = scale.toFixed(1);

    if (!texto) {
        document.getElementById('output').innerHTML = '<p style="color:#94a3b8">Escribí un texto para generar el SVG</p>';
        document.getElementById('codeOutput').value = '';
        return;
    }

    const letras = texto.split('');
    const validLetters = letras.filter(ch => ALFABETO[ch] && ch !== ' ');
    if (validLetters.length === 0) {
        document.getElementById('output').innerHTML = '<p style="color:#94a3b8">No hay letras reconocidas en el texto</p>';
        document.getElementById('codeOutput').value = '';
        return;
    }

    const L = 200; // ancho por letra
    const H = 240; // alto
    const totalWidth = letras.length * spacing + (spacing - L);

    let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalWidth} ${H}" width="${totalWidth * scale}" height="${H * scale}">\n`;
    svgContent += `  <style>\n    .pista { fill: none; stroke: #111111; stroke-width: 6; stroke-linecap: square; stroke-linejoin: miter; }\n    .nodo { fill: #111111; }\n  </style>\n`;

    letras.forEach((ch, idx) => {
        const letterData = ALFABETO[ch];
        if (!letterData) return;
        const offsetX = idx * spacing;

        letterData.paths.forEach(path => {
            const translated = path.d.replace(/([ML])\s*([\d.]+),/g, (match, cmd, x) => {
                return `${cmd} ${parseFloat(x) + offsetX},`;
            });
            svgContent += `  <path class="pista" d="${translated}" />\n`;
        });

        letterData.paths.forEach(path => {
            if (path.nodes) {
                path.nodes.forEach(node => {
                    svgContent += `  <circle class="nodo" cx="${node.cx + offsetX}" cy="${node.cy}" r="6" />\n`;
                });
            }
        });
    });

    svgContent += `</svg>`;

    document.getElementById('output').innerHTML = svgContent;
    document.getElementById('codeOutput').value = svgContent;
}

// ============================================================
// DESCARGA
// ============================================================
function descargarSVG() {
    const code = document.getElementById('codeOutput').value;
    if (!code) return;
    const blob = new Blob([code], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'texto_pcb.svg';
    a.click();
    URL.revokeObjectURL(url);
}

function descargarPNG() {
    const svg = document.querySelector('#output svg');
    if (!svg) return;
    const canvas = document.createElement('canvas');
    const rect = svg.getBoundingClientRect();
    const scale = 2;
    canvas.width = (parseFloat(svg.getAttribute('width')) || rect.width) * scale;
    canvas.height = (parseFloat(svg.getAttribute('height')) || rect.height) * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const data = new XMLSerializer().serializeToString(svg);
    const img = new Image();
    const blob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    img.onload = () => {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(pngBlob => {
            const pngUrl = URL.createObjectURL(pngBlob);
            const a = document.createElement('a');
            a.href = pngUrl;
            a.download = 'texto_pcb.png';
            a.click();
            URL.revokeObjectURL(pngUrl);
        });
    };
    img.src = url;
}

function copiarCodigo() {
    const code = document.getElementById('codeOutput');
    code.select();
    navigator.clipboard.writeText(code.value).then(() => {
        const toast = document.getElementById('toast');
        toast.textContent = 'Código SVG copiado';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    });
}

// ============================================================
// LEGEND (abecedario visual)
// ============================================================
function buildLegend() {
    const legend = document.getElementById('legend');
    const letters = Object.keys(ALFABETO);
    letters.forEach(ch => {
        if (ch === ' ') return;
        const div = document.createElement('div');
        div.className = 'legend-letter';
        div.title = `Letra ${ch}`;
        div.innerHTML = renderLetterSVG(ch, 36, 44);
        div.onclick = () => {
            const input = document.getElementById('textInput');
            input.value += ch;
            generar();
        };
        legend.appendChild(div);
    });
}

function renderLetterSVG(ch, w, h) {
    const data = ALFABETO[ch];
    if (!data || data.paths.length === 0) return '';
    const L = 200, H = 240;
    const sx = w / L, sy = h / H;
    let svg = `<svg viewBox="0 0 ${L} ${H}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<style>.p{fill:none;stroke:#111;stroke-width:6;stroke-linecap:square;stroke-linejoin:miter}.n{fill:#111}</style>`;
    data.paths.forEach(p => {
        svg += `<path class="p" d="${p.d}"/>`;
    });
    data.paths.forEach(p => {
        if (p.nodes) p.nodes.forEach(n => {
            svg += `<circle class="n" cx="${n.cx}" cy="${n.cy}" r="5"/>`;
        });
    });
    svg += '</svg>';
    return svg;
}

// Inicializar
buildLegend();
generar();

// Generar al escribir
document.getElementById('textInput').addEventListener('input', generar);
